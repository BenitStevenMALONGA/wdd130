<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rafting website contact</title>
    <meta name="description" content="This a Rafting website where you can contact us">
    <meta name="author" content="Bénit Steven MALONGA">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    
    <header>
        <img src="images/logo.png" alt="Rafting">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- first section -->
        <section>
            <div class="info">
                <h2>White Water Rafting Company</h2>
                <p>123 Main River Street <br>Kolob, California <br>+1 999 999 9999 <br>info@whitewater.com</p>
            </div>
        </section>
        
        <!-- Second section, with map and form -->
        <section class="carte">
            <div class="map">
               <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2039317.4779516666!2d15.577808968238383!3d-3.3398053158799437!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2scg!4v1786200680546!5m2!1sfr!2scg" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="black">
                
                <form class="form-card" action="">

                    <div class="etude">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="etude">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="etude">
                        <label for="message">Message <br> Purpose</label>

                        <div class="radio">
                            <label for="message"><input type="radio" id="general" name="purpose" value="general" checked>General inquity</label>

                            <label for="message"><input type="radio" id="reservation" name="purpose" value="reservation">Reservation Question</label>

                            <label for="message"><input type="radio" id="suggestion" name="purpose" value="suggestion">Website Suggestion</label>
                        </div>

                    </div>

                        <label for="message">Message</label>
                        <textarea name="message" id="message" placeholder="type here"></textarea>
                    <div class="cheb">
                        <input type="checkbox" id="subscribe" name="subscribe">    
                        <label for="subscribe">Please subscribe me to the monthly nawsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <!-- third section with employes name's -->
        <section class="boite">
            <h2>We are here to Serve You </h2>
            <div class="child">
                <div class="employ">
                    <img src="images/emily.jfif" alt="emily">
                    <p>Gear Manager</p>
                </div>
                <div class="employ">
                    <img src="images/marc.jfif" alt="marc">
                    <p>Safety Kayaker</p>
                </div>
                <div class="employ">
                    <img src="images/sanchez.jfif" alt="sanchez">
                    <p>River Guide</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="pied">
            <div class="der">
                <p>&copy; 2026 Rafting company Name, Bénit Steven MALONGA</p>
            </div>
            
            
            <div class="der">
                <nav class="socialmedia">
                    <a href="https://facebook.com">
                        <img src="images/facebook.svg" alt="Facebook Icon">
                    </a>
                    <a href="https://linkedin.com">
                        <img src="images/linkedin.svg" alt="LinkedIn Icon">
                    </a>
                    <a href="https://instagram.com">
                        <img src="images/instagram.svg" alt="Instagram Icon">
                    </a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
